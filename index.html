<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>מתכונים</title>
    <meta name="description" content="אפליקציה לניהול מתכונים משפחתיים" />

    <meta name="theme-color" content="#38bdf8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="מתכונים" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:title" content="מתכונים" />
    <meta property="og:description" content="אפליקציה לניהול מתכונים משפחתיים" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Last-resort error screen. The React ErrorBoundary only catches failures
      that happen once React is mounted; a module that throws while the bundle
      is still evaluating — a missing VITE_SUPABASE_* variable on the host is
      the classic one — kills the page before any of that runs, and the user
      gets a blank white screen with nothing to go on. This paints the actual
      message instead.
    -->
    <script>
      window.addEventListener("error", function (event) {
        var root = document.getElementById("root");
        if (!root || root.children.length > 0) return;
        var message = (event && event.error && event.error.message) || "שגיאה לא ידועה";
        root.innerHTML =
          '<div dir="rtl" style="font-family:system-ui,sans-serif;max-width:32rem;' +
          'margin:15vh auto;padding:1.5rem;text-align:center;color:#25324a">' +
          '<h1 style="font-size:1.25rem;margin:0 0 .75rem">האפליקציה לא נטענה</h1>' +
          '<p style="margin:0;font-size:.95rem;line-height:1.6;color:#5a6b85"></p></div>';
        root.querySelector("p").textContent = message;
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
